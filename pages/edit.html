<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #fafafa;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #3897f0;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Edit Profile</h1>
        <form action="profile.html" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="User Name">

            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="4">User bio goes here. It can be a few lines long.</textarea>

            <button type="submit">Save Changes</button>
        </form>
    </div>

</body>
</html>
