<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editable User Profile</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #fafafa;
        }
        .profile-container {
            max-width: 935px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
        }
        .profile-header {
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-bottom: 1px solid #dbdbdb;
        }
        .profile-info {
            flex-grow: 1;
        }
        .profile-info input {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            font-size: 18px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
        }
        .profile-info textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            resize: none;
            height: 60px;
        }
        .profile-stats {
            display: flex;
            margin-top: 15px;
        }
        .profile-stats div {
            margin-right: 40px;
            font-size: 16px;
        }
        .profile-stats div span {
            font-weight: bold;
        }
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(293px, 1fr));
            gap: 1px;
            margin-top: 20px;
        }
        .post {
            width: 100%;
            height: 293px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-info">
                <input type="text" id="username" placeholder="Username">
                <textarea id="bio" placeholder="User bio goes here."></textarea>
            </div>
        </div>
        <div class="profile-stats">
            <div><span id="postCount">0</span> posts</div>
            <div><span id="followersCount">0</span> followers</div>
            <div><span id="followingCount">0</span> following</div>
        </div>
        <div class="posts-grid" id="postsGrid">
            <!-- User posts will be inserted here -->
        </div>
    </div>

    <script>
        // Example data
        const profileData = {
            username: 'john_doe',
            bio: 'Travel enthusiast. Love capturing moments.',
            postCount: 5,
            followersCount: 120,
            followingCount: 180,
            posts: [
                'https://example.com/post1',
                'https://example.com/post2',
                'https://example.com/post3',
                'https://example.com/post4',
                'https://example.com/post5',
            ]
        };

        // Set profile data
        document.getElementById('username').value = profileData.username;
        document.getElementById('bio').value = profileData.bio;
        document.getElementById('postCount').innerText = profileData.postCount;
        document.getElementById('followersCount').innerText = profileData.followersCount;
        document.getElementById('followingCount').innerText = profileData.followingCount;

        // Populate posts
        const postsGrid = document.getElementById('postsGrid');
        profileData.posts.forEach(postUrl => {
            const iframe = document.createElement('iframe');
            iframe.src = postUrl;
            iframe.classList.add('post');
            postsGrid.appendChild(iframe);
        });
    </script>
</body>
</html>
