<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabric.js Image Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/4.5.0/fabric.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/spectrum/1.8.0/spectrum.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spectrum/1.8.0/spectrum.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .canvas-container {
            width: 100%;
            height: 90%;
            position: relative;
        }
        .canvas-item {
            width: 100%;
            height: 100%;
        }
        .controls {
            width: 100%;
            height: 10%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f8f8;
            border-top: 1px solid #ccc;
        }
        .controls button {
            margin: 0 10px;
            padding: 10px;
            font-size: 16px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .controls button:hover {
            background-color: #2980b9;
        }
        .controls button:active {
            background-color: #1f618d;
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
    <div class="controls">
        <button id="addTextBtn" onclick="addText()"><i class="fas fa-font"></i></button>
        <button id="drawModeBtn" onclick="toggleDrawingMode()"><i class="fas fa-pencil-alt"></i></button>
        <input type="color" id="colorPicker" style="display: none;" onchange="changeColor(this.value)">
        <button id="colorButton" onclick="applyRandomColor()"><i class="fas fa-palette"></i> Color</button>
        <button onclick="deleteSelected()"><i class="fas fa-trash"></i></button>
        <button onclick="changeBackground()"><i class="fas fa-image"></i> Background</button>
    </div>

    <script>
        const canvas = new fabric.Canvas('canvas', {
            isDrawingMode: false,
            backgroundColor: '#fff'
        });

        const drawModeBtn = document.getElementById('drawModeBtn');
        const colorPicker = document.getElementById('colorPicker');

        canvas.setWidth(window.innerWidth);
        canvas.setHeight(window.innerHeight * 0.9);

        window.addEventListener('resize', () => {
            canvas.setWidth(window.innerWidth);
            canvas.setHeight(window.innerHeight * 0.9);
            canvas.renderAll();
        });

        function addText() {
            const text = new fabric.IText('Type here', {
                left: 50,
                top: 50,
                fontSize: 20,
                fill: colorPicker.value
            });
            canvas.add(text);
            canvas.setActiveObject(text);
            canvas.isDrawingMode = false;
            drawModeBtn.style.backgroundColor = '#3498db';
        }

        function toggleDrawingMode() {
            canvas.isDrawingMode = !canvas.isDrawingMode;
            drawModeBtn.style.backgroundColor = canvas.isDrawingMode ? '#e74c3c' : '#3498db';
        }

        function changeColor(color) {
            const activeObject = canvas.getActiveObject();
            if (activeObject && activeObject.type === 'i-text') {
                activeObject.set('fill', color);
            } else if (canvas.isDrawingMode) {
                canvas.freeDrawingBrush.color = color;
            }
            canvas.renderAll();
        }

        function deleteSelected() {
            const activeObject = canvas.getActiveObject();
            if (activeObject) {
                canvas.remove(activeObject);
            }
        }

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function applyRandomColor() {
            const activeObject = canvas.getActiveObject();
            if (activeObject && activeObject.type === 'i-text') {
                const randomColor = getRandomColor();
                activeObject.set('fill', randomColor);
                canvas.renderAll();
            } else {
                document.getElementById('colorPicker').click();
            }
        }

        function changeBackground() {
            const backgroundUrl = 'https://images.unsplash.com/photo-1612529033556-1a07a99c73d0?q=80&w=2612&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D';
            fabric.Image.fromURL(backgroundUrl, function(img) {
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                    scaleX: canvas.width / img.width,
                    scaleY: canvas.height / img.height
                });
            });
        }

        canvas.on('mouse:down', function() {
            if (canvas.isDrawingMode) {
                drawModeBtn.style.backgroundColor = '#e74c3c';
            }
        });

        canvas.on('selection:created', function() {
            if (canvas.isDrawingMode) {
                canvas.isDrawingMode = false;
                drawModeBtn.style.backgroundColor = '#3498db';
            }
        });

        canvas.on('selection:cleared', function() {
            if (canvas.getActiveObject() === null && !canvas.isDrawingMode) {
                drawModeBtn.style.backgroundColor = '#3498db';
            }
        });
    </script>
</body>
</html>
