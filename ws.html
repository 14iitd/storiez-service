<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload with Preview and Caption</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        h1 {
            color: #333;
        }
        #upload-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        #imageLoader {
            display: none;
        }
        .upload-label {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 16px;
        }
        .upload-label:hover {
            background-color: #45a049;
        }
        #image-preview {
            margin-top: 20px;
            max-width: 100%;
            border: 1px solid #ccc;
            padding: 10px;
            display: none;
            border-radius: 8px;
        }
        #caption-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            font-size: 16px;
        }
        .submit-button {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 16px;
            margin-top: 10px;
        }
        .submit-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="upload-container">
        <h1>Upload an Image and Preview</h1>
        <label for="imageLoader" class="upload-label">Choose Image</label>
        <input type="file" id="imageLoader" accept="image/*">
        <div id="image-preview-container">
            <img id="image-preview" src="" alt="Image Preview">
        </div>
        <div id="caption-container">
            <textarea id="image-caption" rows="4" placeholder="Write a caption..."></textarea>
            <button class="submit-button" onclick="submitImage()">Submit</button>
        </div>
    </div>

    <script>
        document.getElementById('imageLoader').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(event) {
                    var imgElement = document.getElementById('image-preview');
                    imgElement.src = event.target.result;
                    imgElement.style.display = 'block';
                    document.getElementById('caption-container').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        });

        function submitImage() {
            var caption = document.getElementById('image-caption').value;
            alert("Image submitted with caption: " + caption);
        }
    </script>
</body>
</html>
